<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" aria-label="Un asistente con IA responde a un cliente por el móvil y le reserva una cita">
<title>Un asistente con IA responde a un cliente por el móvil y le reserva una cita</title>
<style>
text{font-family:Inter,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
.serif{font-family:'Instrument Serif',Georgia,serif;font-weight:400}
.float{animation:float 6s ease-in-out infinite}
.pulse{animation:pulse 3.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.flow{stroke-dasharray:10 150;animation:flow 2.8s linear infinite}
.dot{animation:dot 1.2s ease-in-out infinite}
.scan{animation:scan 3.4s ease-in-out infinite alternate}
.spin{animation:spin 14s linear infinite;transform-box:fill-box;transform-origin:center}
@keyframes float{50%{transform:translateY(-8px)}}
@keyframes pulse{50%{transform:scale(1.07)}}
@keyframes flow{from{stroke-dashoffset:160}to{stroke-dashoffset:0}}
@keyframes dot{50%{opacity:.25}}
@keyframes scan{to{transform:translateY(222px)}}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.flow,.scan{display:none}}
</style>
<defs>
<radialGradient id="a"><stop offset="0" stop-color="#F2B632" stop-opacity=".34"/><stop offset="1" stop-color="#F2B632" stop-opacity="0"/></radialGradient>
<radialGradient id="b"><stop offset="0" stop-color="#FF9A5A" stop-opacity=".18"/><stop offset="1" stop-color="#FF9A5A" stop-opacity="0"/></radialGradient>
<pattern id="p" width="26" height="26" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.1" fill="#14151A" opacity=".07"/></pattern>
<filter id="sh" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#14151A" flood-opacity=".09"/></filter>
</defs>
<rect width="800" height="450" fill="#F8F6F1"/><rect width="800" height="450" fill="url(#p)"/>
<circle cx="700" cy="40" r="300" fill="url(#a)"/><circle cx="60" cy="440" r="260" fill="url(#b)"/>
<rect x="70" y="36" width="400" height="378" rx="30" fill="#fff" stroke="rgba(20,21,26,.10)" stroke-width="1.5" filter="url(#sh)"/><circle cx="114" cy="80" r="20" fill="#FDF0CF"/><g transform="translate(102 68) scale(1)" fill="none" stroke="#8F5D00" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></g><text x="146" y="77" font-size="21" font-weight="700" fill="#14151A" text-anchor="start">Tu negocio</text><text x="146" y="99" font-size="16" font-weight="500" fill="#146C34" text-anchor="start">Asistente activo</text><path d="M70 118h400" stroke="rgba(20,21,26,.08)"/><rect x="94" y="134" width="262" height="50" rx="16" fill="#fff" stroke="rgba(20,21,26,.12)" stroke-width="1.5"/><text x="112" y="166" font-size="21" font-weight="500" fill="#14151A" text-anchor="start">¿Abrís el sábado?</text><rect x="160" y="196" width="286" height="78" rx="16" fill="#F2B632" stroke="none" stroke-width="1.5"/><text x="178" y="228" font-size="21" font-weight="500" fill="#14151A" text-anchor="start">Sí, de 10 a 14 h.</text><text x="178" y="256" font-size="21" font-weight="500" fill="#14151A" text-anchor="start">¿Te reservo hueco?</text><rect x="94" y="286" width="236" height="50" rx="16" fill="#fff" stroke="rgba(20,21,26,.12)" stroke-width="1.5"/><text x="112" y="318" font-size="21" font-weight="500" fill="#14151A" text-anchor="start">Sí, a las 11:00</text><rect x="364" y="352" width="82" height="38" rx="19" fill="#fff" stroke="rgba(20,21,26,.12)" stroke-width="1.5"/><circle class="dot" style="animation-delay:0s" cx="389" cy="371" r="5" fill="#54565F"/><circle class="dot" style="animation-delay:0.2s" cx="405" cy="371" r="5" fill="#54565F"/><circle class="dot" style="animation-delay:0.4s" cx="421" cy="371" r="5" fill="#54565F"/><g class="float" style="animation-delay:0s"><rect x="520" y="84" width="220" height="72" rx="16" fill="#fff" stroke="rgba(20,21,26,.10)" stroke-width="1.5" filter="url(#sh)"/><rect x="534" y="98" width="44" height="44" rx="12" fill="#FDF0CF" stroke="none" stroke-width="1.5"/><g transform="translate(542.2 106.2) scale(1.15)" fill="none" stroke="#8F5D00" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18M8 15h3"/></g><text x="592" y="128" font-size="20" font-weight="600" fill="#14151A" text-anchor="start">Cita anotada</text></g><g class="float" style="animation-delay:-2s"><rect x="540" y="188" width="200" height="72" rx="16" fill="#fff" stroke="rgba(20,21,26,.10)" stroke-width="1.5" filter="url(#sh)"/><rect x="554" y="202" width="44" height="44" rx="12" fill="#FDF0CF" stroke="none" stroke-width="1.5"/><g transform="translate(562.2 210.2) scale(1.15)" fill="none" stroke="#8F5D00" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9M10 21a2 2 0 0 0 4 0"/></g><text x="612" y="232" font-size="20" font-weight="600" fill="#14151A" text-anchor="start">Te aviso</text></g><g class="float" style="animation-delay:-4s"><rect x="515" y="292" width="230" height="72" rx="16" fill="#fff" stroke="rgba(20,21,26,.10)" stroke-width="1.5" filter="url(#sh)"/><rect x="529" y="306" width="44" height="44" rx="12" fill="#FDF0CF" stroke="none" stroke-width="1.5"/><g transform="translate(537.2 314.2) scale(1.15)" fill="none" stroke="#8F5D00" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></g><text x="587" y="336" font-size="20" font-weight="600" fill="#14151A" text-anchor="start">Lead guardado</text></g><path d="M470 235C505 235 490 120 520 120" fill="none" stroke="rgba(20,21,26,.14)" stroke-width="2.5" stroke-linecap="round"/><path class="flow" d="M470 235C505 235 490 120 520 120" fill="none" stroke="#F2B632" stroke-width="3.5" stroke-linecap="round"/><path d="M470 235C510 235 505 224 540 224" fill="none" stroke="rgba(20,21,26,.14)" stroke-width="2.5" stroke-linecap="round"/><path class="flow" d="M470 235C510 235 505 224 540 224" fill="none" stroke="#F2B632" stroke-width="3.5" stroke-linecap="round"/><path d="M470 235C505 235 485 328 515 328" fill="none" stroke="rgba(20,21,26,.14)" stroke-width="2.5" stroke-linecap="round"/><path class="flow" d="M470 235C505 235 485 328 515 328" fill="none" stroke="#F2B632" stroke-width="3.5" stroke-linecap="round"/><text x="780" y="436" font-size="15" font-weight="500" fill="#54565F" text-anchor="end">Ejemplo ilustrativo</text>
</svg>
