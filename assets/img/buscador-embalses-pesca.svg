DF0CF"/><g transform="translate(94.4 311.4) scale(0.8)" fill="none" stroke="#8F5D00" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M2 9c3-3 5 3 8 0s5 3 8 0 3-1 4 0M2 16c3-3 5 3 8 0s5 3 8 0 3-1 4 0"/></g><text x="134" y="318" font-size="20" font-weight="600" fill="#14151A" text-anchor="start">Embalse C</text><rect x="134" y="330" width="120" height="10" rx="5" fill="rgba(20,21,26,.12)" stroke="none" stroke-width="1.5"/></g><rect x="404" y="52" width="336" height="344" rx="18" fill="#fff" stroke="rgba(20,21,26,.10)" stroke-width="1.5" filter="url(#sh)"/><path d="M446 150c40-50 96-10 120-40s90-20 112 28-26 56-12 96-30 88-86 70-44-52-92-44-78-60-42-110z" fill="#CFE6F5"/><path d="M470 190c26-14 40 14 66 0s40 14 66 0M510 262c26-14 40 14 66 0s40 14 66 0" fill="none" stroke="#6FA8CC" stroke-width="3" stroke-linecap="round"/><g class="float" style="animation-delay:-1s"><path d="M506 168c-26-30-26-52 0-52s26 22 0 52z" fill="#F2B632" stroke="#14151A" stroke-width="3" stroke-linejoin="round"/><circle cx="506" cy="136" r="8" fill="#fff"/></g><g class="float" style="animation-delay:-3s"><path d="M636 214c-26-30-26-52 0-52s26 22 0 52z" fill="#F2B632" stroke="#14151A" stroke-width="3" stroke-linejoin="round"/><circle cx="636" cy="182" r="8" fill="#fff"/></g><g class="float" style="animation-delay:-5s"><path d="M560 316c-26-30-26-52 0-52s26 22 0 52z" fill="#F2B632" stroke="#14151A" stroke-width="3" stroke-linejoin="round"/><circle cx="560" cy="284" r="8" fill="#fff"/></g><text x="780" y="436" font-size="15" font-weight="500" fill="#54565F" text-anchor="end">Ejemplo ilustrativo</text>
</svg>
