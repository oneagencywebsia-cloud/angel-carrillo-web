<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" aria-label="Lista de tareas que se van marcando como hechas sin intervención">
<title>Lista de tareas que se van marcando como hechas sin intervención</title>
<style>
text{font-family:Inter,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
.serif{font-family:'Instrument Serif',Georgia,serif;font-weight:400}
.float{animation:float 6s ease-in-out infinite}
.pulse{animation:pulse 3.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.flow{stroke-dasharray:10 150;animation:flow 2.8s linear infinite}
.dot{animation:dot 1.2s ease-in-out infinite}
.scan{animation:scan 3.4s ease-in-out infinite alternate}
.spin{animation:spin 14s linear infinite;transform-box:fill-box;transform-origin:center}
@keyframes float{50%{transform:translateY(-8px)}}
@keyframes pulse{50%{transform:scale(1.07)}}
@keyframes flow{from{stroke-dashoffset:160}to{stroke-dashoffset:0}}
@keyframes dot{50%{opacity:.25}}
@keyframes scan{to{transform:translateY(222px)}}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.flow,.scan{display:none}}
</style>
<defs>
<radialGradient id="a"><stop offset="0" stop-color="#F2B632" stop-opacity=".34"/><stop offset="1" stop-color="#F2B632" stop-opacity="0"/></radialGradient>
<radialGradient id="b"><stop offset="0" stop-color="#FF9A5A" stop-opacity=".18"/><stop offset="1" stop-color="#FF9A5A" stop-opacity="0"/></radialGradient>
<pattern id="p" width="26" height="26" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.1" fill="#14151A" opacity=".07"/></pattern>
<filter id="sh" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#14151A" flood-opacity=".09"/></filter>
</defs>
<rect width="800" height="450" fill="#F8F6F1"/><rect width="800" height="450" fill="url(#p)"/>
<circle cx="700" cy="40" r="300" fill="url(#a)"/><circle cx="60" cy="440" r="260" fill="url(#b)"/>
<g class="float" style="animation-delay:0s"><rect x="190" y="52" width="420" height="62" rx="14" fill="#fff" stroke="rgba(20,21,26,.10)" stroke-width="1.5" filter="url(#sh)"/><g transform="translate(228 83)"><circle r="15" fill="#146C34"/><path d="M-6.75 0.3l4.5 4.8l9 -9.3" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g><text x="262" y="91" font-size="22" font-weight="600" fill="#14151A" text-anchor="start">Email de seguimiento</text><rect x="500" y="68" width="88" height="30" rx="15" fill="#DCF2E3" stroke="none" stroke-width="1.5"/><text x="544" y="89" font-size="16" font-weight="700" fill="#146C34" text-anchor="middle">Hecho</text></g><g class="float" style="animation-delay:-1.5s"><rect x="190" y="134" width="420" height="62" rx="14" fill="#fff" stroke="rgba(20,21,26,.10)" stroke-width="1.5" filter="url(#sh)"/><g transform="translate(228 165)"><circle r="15" fill="#146C34"/><path d="M-6.75 0.3l4.5 4.8l9 -9.3" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g><text x="262" y="173" font-size="22" font-weight="600" fill="#14151A" text-anchor="start">Recordatorio de cita</text><rect x="500" y="150" width="88" height="30" rx="15" fill="#DCF2E3" stroke="none" stroke-width="1.5"/><text x="544" y="171" font-size="16" font-weight="700" fill="#146C34" text-anchor="middle">Hecho</text></g><g class="float" style="animation-delay:-3s"><rect x="190" y="216" width="420" height="62" rx="14" fill="#fff" stroke="rgba(20,21,26,.10)" stroke-width="1.5" filter="url(#sh)"/><g transform="translate(228 247)"><circle r="15" fill="#146C34"/><path d="M-6.75 0.3l4.5 4.8l9 -9.3" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g><text x="262" y="255" font-size="22" font-weight="600" fill="#14151A" text-anchor="start">Informe semanal</text><rect x="500" y="232" width="88" height="30" rx="15" fill="#DCF2E3" stroke="none" stroke-width="1.5"/><text x="544" y="253" font-size="16" font-weight="700" fill="#146C34" text-anchor="middle">Hecho</text></g><g class="float" style="animation-delay:-4.5s"><rect x="190" y="298" width="420" height="62" rx="14" fill="#fff" stroke="rgba(20,21,26,.10)" stroke-width="1.5" filter="url(#sh)"/><circle class="pulse" cx="228" cy="329" r="14" fill="none" stroke="#F2B632" stroke-width="4"/><text x="262" y="337" font-size="22" font-weight="600" fill="#14151A" text-anchor="start">Actualizar la hoja</text><rect x="500" y="314" width="88" height="30" rx="15" fill="#FDF0CF" stroke="none" stroke-width="1.5"/><text x="544" y="335" font-size="16" font-weight="700" fill="#8F5D00" text-anchor="middle">En curso</text></g><text x="780" y="436" font-size="15" font-weight="500" fill="#54565F" text-anchor="end">Ejemplo ilustrativo</text>
</svg>
