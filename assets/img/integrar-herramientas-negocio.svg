<g class="float" style="animation-delay:-1.4s"><rect x="540" y="72" width="200" height="72" rx="16" fill="#fff" stroke="rgba(20,21,26,.10)" stroke-width="1.5" filter="url(#sh)"/><rect x="554" y="86" width="44" height="44" rx="12" fill="#FDF0CF" stroke="none" stroke-width="1.5"/><g transform="translate(562.2 94.2) scale(1.15)" fill="none" stroke="#8F5D00" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></g><text x="612" y="116" font-size="20" font-weight="600" fill="#14151A" text-anchor="start">Email</text></g><g class="float" style="animation-delay:-2.8s"><rect x="60" y="306" width="200" height="72" rx="16" fill="#fff" stroke="rgba(20,21,26,.10)" stroke-width="1.5" filter="url(#sh)"/><rect x="74" y="320" width="44" height="44" rx="12" fill="#FDF0CF" stroke="none" stroke-width="1.5"/><g transform="translate(82.2 328.2) scale(1.15)" fill="none" stroke="#8F5D00" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18M8 15h3"/></g><text x="132" y="350" font-size="20" font-weight="600" fill="#14151A" text-anchor="start">Calendario</text></g><g class="float" style="animation-delay:-4.199999999999999s"><rect x="540" y="306" width="200" height="72" rx="16" fill="#fff" stroke="rgba(20,21,26,.10)" stroke-width="1.5" filter="url(#sh)"/><rect x="554" y="320" width="44" height="44" rx="12" fill="#FDF0CF" stroke="none" stroke-width="1.5"/><g transform="translate(562.2 328.2) scale(1.15)" fill="none" stroke="#8F5D00" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6a7 7 0 1 0 0 12M4 10h9M4 14h8"/></g><text x="612" y="350" font-size="20" font-weight="600" fill="#14151A" text-anchor="start">Contabilidad</text></g><text x="400" y="424" font-size="20" font-weight="500" fill="#54565F" text-anchor="middle">Un dato, escrito una sola vez</text>
</svg>
