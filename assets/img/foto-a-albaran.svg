<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" aria-label="Un albarán en papel fotografiado para que la IA saque sus datos">
<title>Un albarán en papel fotografiado para que la IA saque sus datos</title>
<style>
text{font-family:Inter,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
.serif{font-family:'Instrument Serif',Georgia,serif;font-weight:400}
.float{animation:float 6s ease-in-out infinite}
.pulse{animation:pulse 3.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.flow{stroke-dasharray:10 150;animation:flow 2.8s linear infinite}
.dot{animation:dot 1.2s ease-in-out infinite}
.scan{animation:scan 3.4s ease-in-out infinite alternate}
.spin{animation:spin 14s linear infinite;transform-box:fill-box;transform-origin:center}
@keyframes float{50%{transform:translateY(-8px)}}
@keyframes pulse{50%{transform:scale(1.07)}}
@keyframes flow{from{stroke-dashoffset:160}to{stroke-dashoffset:0}}
@keyframes dot{50%{opacity:.25}}
@keyframes scan{to{transform:translateY(222px)}}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.flow,.scan{display:none}}
</style>
<defs>
<radialGradient id="a"><stop offset="0" stop-color="#F2B632" stop-opacity=".34"/><stop offset="1" stop-color="#F2B632" stop-opacity="0"/></radialGradient>
<radialGradient id="b"><stop offset="0" stop-color="#FF9A5A" stop-opacity=".18"/><stop offset="1" stop-color="#FF9A5A" stop-opacity="0"/></radialGradient>
<pattern id="p" width="26" height="26" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.1" fill="#14151A" opacity=".07"/></pattern>
<filter id="sh" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#14151A" flood-opacity=".09"/></filter>
</defs>
<rect width="800" height="450" fill="#F8F6F1"/><rect width="800" height="450" fill="url(#p)"/>
<circle cx="700" cy="40" r="300" fill="url(#a)"/><circle cx="60" cy="440" r="260" fill="url(#b)"/>
<g transform="rotate(-14 330 220)"><rect x="240" y="100" width="180" height="240" rx="10" fill="#fff" stroke="rgba(20,21,26,.10)" stroke-width="1.5" filter="url(#sh)"/><rect x="260" y="128" width="90" height="10" rx="5" fill="#14151A" stroke="none" stroke-width="1.5"/><rect x="260" y="160" width="140" height="10" rx="5" fill="rgba(20,21,26,.12)" stroke="none" stroke-width="1.5"/><rect x="260" y="186" width="140" height="10" rx="5" fill="rgba(20,21,26,.12)" stroke="none" stroke-width="1.5"/><rect x="260" y="212" width="140" height="10" rx="5" fill="rgba(20,21,26,.12)" stroke="none" stroke-width="1.5"/><rect x="260" y="238" width="140" height="10" rx="5" fill="rgba(20,21,26,.12)" stroke="none" stroke-width="1.5"/><rect x="260" y="264" width="140" height="10" rx="5" fill="rgba(20,21,26,.12)" stroke="none" stroke-width="1.5"/><rect x="344" y="300" width="56" height="14" rx="7" fill="#F2B632" stroke="none" stroke-width="1.5"/></g><g transform="rotate(11 470 228)"><rect x="380" y="108" width="180" height="240" rx="10" fill="#fff" stroke="rgba(20,21,26,.10)" stroke-width="1.5" filter="url(#sh)"/><rect x="400" y="136" width="90" height="10" rx="5" fill="#14151A" stroke="none" stroke-width="1.5"/><rect x="400" y="168" width="140" height="10" rx="5" fill="rgba(20,21,26,.12)" stroke="none" stroke-width="1.5"/><rect x="400" y="194" width="140" height="10" rx="5" fill="rgba(20,21,26,.12)" stroke="none" stroke-width="1.5"/><rect x="400" y="220" width="140" height="10" rx="5" fill="rgba(20,21,26,.12)" stroke="none" stroke-width="1.5"/><rect x="400" y="246" width="140" height="10" rx="5" fill="rgba(20,21,26,.12)" stroke="none" stroke-width="1.5"/><rect x="400" y="272" width="140" height="10" rx="5" fill="rgba(20,21,26,.12)" stroke="none" stroke-width="1.5"/><rect x="484" y="308" width="56" height="14" rx="7" fill="#F2B632" stroke="none" stroke-width="1.5"/></g><g class="float" style="animation-delay:0s"><g transform="rotate(0 400 212)"><rect x="310" y="92" width="180" height="240" rx="10" fill="#fff" stroke="rgba(20,21,26,.10)" stroke-width="1.5" filter="url(#sh)"/><rect x="330" y="120" width="90" height="10" rx="5" fill="#14151A" stroke="none" stroke-width="1.5"/><rect x="330" y="152" width="140" height="10" rx="5" fill="rgba(20,21,26,.12)" stroke="none" stroke-width="1.5"/><rect x="330" y="178" width="140" height="10" rx="5" fill="rgba(20,21,26,.12)" stroke="none" stroke-width="1.5"/><rect x="330" y="204" width="140" height="10" rx="5" fill="rgba(20,21,26,.12)" stroke="none" stroke-width="1.5"/><rect x="330" y="230" width="140" height="10" rx="5" fill="rgba(20,21,26,.12)" stroke="none" stroke-width="1.5"/><rect x="330" y="256" width="140" height="10" rx="5" fill="rgba(20,21,26,.12)" stroke="none" stroke-width="1.5"/><rect x="414" y="292" width="56" height="14" rx="7" fill="#F2B632" stroke="none" stroke-width="1.5"/></g></g><g class="pulse" style="animation-delay:0s"><path d="M262 106V56H312" fill="none" stroke="#14151A" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><path d="M538 106V56H488" fill="none" stroke="#14151A" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><path d="M262 330V380H312" fill="none" stroke="#14151A" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><path d="M538 330V380H488" fill="none" stroke="#14151A" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/></g><g class="float" style="animation-delay:-2s"><rect x="40" y="188" width="180" height="72" rx="16" fill="#fff" stroke="rgba(20,21,26,.10)" stroke-width="1.5" filter="url(#sh)"/><rect x="54" y="202" width="44" height="44" rx="12" fill="#FDF0CF" stroke="none" stroke-width="1.5"/><g transform="translate(62.2 210.2) scale(1.15)" fill="none" stroke="#8F5D00" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></g><text x="112" y="232" font-size="20" font-weight="600" fill="#14151A" text-anchor="start">Leyendo</text></g><g class="float" style="animation-delay:-4s"><rect x="580" y="188" width="190" height="72" rx="16" fill="#fff" stroke="rgba(20,21,26,.10)" stroke-width="1.5" filter="url(#sh)"/><rect x="594" y="202" width="44" height="44" rx="12" fill="#FDF0CF" stroke="none" stroke-width="1.5"/><g transform="translate(602.2 210.2) scale(1.15)" fill="none" stroke="#8F5D00" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 10h18M3 15h18M9 4v16"/></g><text x="652" y="232" font-size="20" font-weight="600" fill="#14151A" text-anchor="start">Apuntado</text></g><path d="M222 224H306" fill="none" stroke="rgba(20,21,26,.14)" stroke-width="2.5" stroke-linecap="round"/><path class="flow" d="M222 224H306" fill="none" stroke="#F2B632" stroke-width="3.5" stroke-linecap="round"/><path d="M494 224H578" fill="none" stroke="rgba(20,21,26,.14)" stroke-width="2.5" stroke-linecap="round"/><path class="flow" d="M494 224H578" fill="none" stroke="#F2B632" stroke-width="3.5" stroke-linecap="round"/><text x="780" y="436" font-size="15" font-weight="500" fill="#54565F" text-anchor="end">Ejemplo ilustrativo</text>
