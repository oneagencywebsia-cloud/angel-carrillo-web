<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" aria-label="Una balanza que compara llevar las facturas a mano con leerlas con IA">
<title>Una balanza que compara llevar las facturas a mano con leerlas con IA</title>
<style>
text{font-family:Inter,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
.serif{font-family:'Instrument Serif',Georgia,serif;font-weight:400}
.float{animation:float 6s ease-in-out infinite}
.pulse{animation:pulse 3.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.flow{stroke-dasharray:10 150;animation:flow 2.8s linear infinite}
.dot{animation:dot 1.2s ease-in-out infinite}
.scan{animation:scan 3.4s ease-in-out infinite alternate}
.spin{animation:spin 14s linear infinite;transform-box:fill-box;transform-origin:center}
@keyframes float{50%{transform:translateY(-8px)}}
@keyframes pulse{50%{transform:scale(1.07)}}
@keyframes flow{from{stroke-dashoffset:160}to{stroke-dashoffset:0}}
@keyframes dot{50%{opacity:.25}}
@keyframes scan{to{transform:translateY(222px)}}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.flow,.scan{display:none}}
</style>
<defs>
<radialGradient id="a"><stop offset="0" stop-color="#F2B632" stop-opacity=".34"/><stop offset="1" stop-color="#F2B632" stop-opacity="0"/></radialGradient>
<radialGradient id="b"><stop offset="0" stop-color="#FF9A5A" stop-opacity=".18"/><stop offset="1" stop-color="#FF9A5A" stop-opacity="0"/></radialGradient>
<pattern id="p" width="26" height="26" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.1" fill="#14151A" opacity=".07"/></pattern>
<filter id="sh" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#14151A" flood-opacity=".09"/></filter>
</defs>
<rect width="800" height="450" fill="#F8F6F1"/><rect width="800" height="450" fill="url(#p)"/>
<circle cx="700" cy="40" r="300" fill="url(#a)"/><circle cx="60" cy="440" r="260" fill="url(#b)"/>
<style>.tip{animation:tip 5s ease-in-out infinite;transform-origin:400px 148px}@keyframes tip{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}</style><path d="M400 120v290M320 410h160" stroke="#14151A" stroke-width="8" stroke-linecap="round"/><g class="tip"><path d="M190 148h420" stroke="#14151A" stroke-width="8" stroke-linecap="round"/><path d="M190 148l-70 118M190 148l70 118" stroke="#14151A" stroke-width="3"/><path d="M104 266h172a86 46 0 0 1-172 0z" fill="#F2B632" stroke="#14151A" stroke-width="4" stroke-linejoin="round"/><g transform="translate(164.8 210.8) scale(2.1)" fill="none" stroke="#14151A" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 10h18M3 15h18M9 4v16"/></g><text x="190" y="352" font-size="23" font-weight="700" fill="#14151A" text-anchor="middle">A mano</text><path d="M610 148l-70 118M610 148l70 118" stroke="#14151A" stroke-width="3"/><path d="M524 266h172a86 46 0 0 1-172 0z" fill="#F2B632" stroke="#14151A" stroke-width="4" stroke-linejoin="round"/><g transform="translate(584.8 210.8) scale(2.1)" fill="none" stroke="#14151A" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></g><text x="610" y="352" font-size="23" font-weight="700" fill="#14151A" text-anchor="middle">Con IA</text></g><circle cx="400" cy="148" r="16" fill="#F2B632" stroke="#14151A" stroke-width="4"/>
</svg>
