<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" aria-label="Los datos de un documento pasan ordenados a una hoja de cálculo">
<title>Los datos de un documento pasan ordenados a una hoja de cálculo</title>
<style>
text{font-family:Inter,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
.serif{font-family:'Instrument Serif',Georgia,serif;font-weight:400}
.float{animation:float 6s ease-in-out infinite}
.pulse{animation:pulse 3.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.flow{stroke-dasharray:10 150;animation:flow 2.8s linear infinite}
.dot{animation:dot 1.2s ease-in-out infinite}
.scan{animation:scan 3.4s ease-in-out infinite alternate}
.spin{animation:spin 14s linear infinite;transform-box:fill-box;transform-origin:center}
@keyframes float{50%{transform:translateY(-8px)}}
@keyframes pulse{50%{transform:scale(1.07)}}
@keyframes flow{from{stroke-dashoffset:160}to{stroke-dashoffset:0}}
@keyframes dot{50%{opacity:.25}}
@keyframes scan{to{transform:translateY(222px)}}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.flow,.scan{display:none}}
</style>
<defs>
<radialGradient id="a"><stop offset="0" stop-color="#F2B632" stop-opacity=".34"/><stop offset="1" stop-color="#F2B632" stop-opacity="0"/></radialGradient>
<radialGradient id="b"><stop offset="0" stop-color="#FF9A5A" stop-opacity=".18"/><stop offset="1" stop-color="#FF9A5A" stop-opacity="0"/></radialGradient>
<pattern id="p" width="26" height="26" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.1" fill="#14151A" opacity=".07"/></pattern>
<filter id="sh" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#14151A" flood-opacity=".09"/></filter>
</defs>
<rect width="800" height="450" fill="#F8F6F1"/><rect width="800" height="450" fill="url(#p)"/>
<circle cx="700" cy="40" r="300" fill="url(#a)"/><circle cx="60" cy="440" r="260" fill="url(#b)"/>
<g transform="rotate(-6 170 225)"><rect x="80" y="105" width="180" height="240" rx="10" fill="#fff" stroke="rgba(20,21,26,.10)" stroke-width="1.5" filter="url(#sh)"/><rect x="100" y="133" width="90" height="10" rx="5" fill="#14151A" stroke="none" stroke-width="1.5"/><rect x="100" y="165" width="140" height="10" rx="5" fill="rgba(20,21,26,.12)" stroke="none" stroke-width="1.5"/><rect x="100" y="191" width="140" height="10" rx="5" fill="rgba(20,21,26,.12)" stroke="none" stroke-width="1.5"/><rect x="100" y="217" width="140" height="10" rx="5" fill="rgba(20,21,26,.12)" stroke="none" stroke-width="1.5"/><rect x="100" y="243" width="140" height="10" rx="5" fill="rgba(20,21,26,.12)" stroke="none" stroke-width="1.5"/><rect x="100" y="269" width="140" height="10" rx="5" fill="rgba(20,21,26,.12)" stroke="none" stroke-width="1.5"/><rect x="184" y="305" width="56" height="14" rx="7" fill="#F2B632" stroke="none" stroke-width="1.5"/></g><path d="M290 225H390" fill="none" stroke="rgba(20,21,26,.14)" stroke-width="2.5" stroke-linecap="round"/><path class="flow" d="M290 225H390" fill="none" stroke="#F2B632" stroke-width="3.5" stroke-linecap="round"/><path d="M378 213l14 12-14 12" fill="none" stroke="#8F5D00" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="408" y="92" width="332" height="266" rx="14" fill="#fff" stroke="rgba(20,21,26,.10)" stroke-width="1.5" filter="url(#sh)"/><rect x="408" y="92" width="332" height="52" rx="14" fill="#14151A" stroke="none" stroke-width="1.5"/><text x="430" y="126" font-size="19" font-weight="700" fill="#fff" text-anchor="start">Fecha</text><text x="538" y="126" font-size="19" font-weight="700" fill="#fff" text-anchor="start">Concepto</text><text x="646" y="126" font-size="19" font-weight="700" fill="#fff" text-anchor="start">Total</text><g class="pulse" style="animation-delay:0s"><rect x="430" y="174" width="56" height="14" rx="7" fill="rgba(20,21,26,.16)" stroke="none" stroke-width="1.5"/><rect x="538" y="174" width="82" height="14" rx="7" fill="rgba(20,21,26,.16)" stroke="none" stroke-width="1.5"/><rect x="646" y="174" width="56" height="14" rx="7" fill="#F2B632" stroke="none" stroke-width="1.5"/></g><path d="M408 200h332" stroke="rgba(20,21,26,.08)"/><g class="pulse" style="animation-delay:0.5s"><rect x="430" y="222" width="56" height="14" rx="7" fill="rgba(20,21,26,.16)" stroke="none" stroke-width="1.5"/><rect x="538" y="222" width="82" height="14" rx="7" fill="rgba(20,21,26,.16)" stroke="none" stroke-width="1.5"/><rect x="646" y="222" width="56" height="14" rx="7" fill="#F2B632" stroke="none" stroke-width="1.5"/></g><path d="M408 248h332" stroke="rgba(20,21,26,.08)"/><g class="pulse" style="animation-delay:1s"><rect x="430" y="270" width="56" height="14" rx="7" fill="rgba(20,21,26,.16)" stroke="none" stroke-width="1.5"/><rect x="538" y="270" width="82" height="14" rx="7" fill="rgba(20,21,26,.16)" stroke="none" stroke-width="1.5"/><rect x="646" y="270" width="56" height="14" rx="7" fill="#F2B632" stroke="none" stroke-width="1.5"/></g><path d="M408 296h332" stroke="rgba(20,21,26,.08)"/><g class="pulse" style="animation-delay:1.5s"><rect x="430" y="318" width="56" height="14" rx="7" fill="rgba(20,21,26,.16)" stroke="none" stroke-width="1.5"/><rect x="538" y="318" width="82" height="14" rx="7" fill="rgba(20,21,26,.16)" stroke="none" stroke-width="1.5"/><rect x="646" y="318" width="56" height="14" rx="7" fill="#F2B632" stroke="none" stroke-width="1.5"/></g><path d="M408 344h332" stroke="rgba(20,21,26,.08)"/><text x="780" y="436" font-size="15" font-weight="500" fill="#54565F" text-anchor="end">Ejemplo ilustrativo</text>
</svg>
