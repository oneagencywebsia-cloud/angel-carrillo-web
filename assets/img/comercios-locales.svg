<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" aria-label="Un taller, una clínica y una tienda de barrio">
<title>Un taller, una clínica y una tienda de barrio</title>
<style>
text{font-family:Inter,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
.serif{font-family:'Instrument Serif',Georgia,serif;font-weight:400}
.float{animation:float 6s ease-in-out infinite}
.pulse{animation:pulse 3.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.flow{stroke-dasharray:10 150;animation:flow 2.8s linear infinite}
.dot{animation:dot 1.2s ease-in-out infinite}
.scan{animation:scan 3.4s ease-in-out infinite alternate}
.spin{animation:spin 14s linear infinite;transform-box:fill-box;transform-origin:center}
@keyframes float{50%{transform:translateY(-8px)}}
@keyframes pulse{50%{transform:scale(1.07)}}
@keyframes flow{from{stroke-dashoffset:160}to{stroke-dashoffset:0}}
@keyframes dot{50%{opacity:.25}}
@keyframes scan{to{transform:translateY(222px)}}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.flow,.scan{display:none}}
</style>
<defs>
<radialGradient id="a"><stop offset="0" stop-color="#F2B632" stop-opacity=".34"/><stop offset="1" stop-color="#F2B632" stop-opacity="0"/></radialGradient>
<radialGradient id="b"><stop offset="0" stop-color="#FF9A5A" stop-opacity=".18"/><stop offset="1" stop-color="#FF9A5A" stop-opacity="0"/></radialGradient>
<pattern id="p" width="26" height="26" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.1" fill="#14151A" opacity=".07"/></pattern>
<filter id="sh" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#14151A" flood-opacity=".09"/></filter>
</defs>
<rect width="800" height="450" fill="#F8F6F1"/><rect width="800" height="450" fill="url(#p)"/>
<circle cx="700" cy="40" r="300" fill="url(#a)"/><circle cx="60" cy="440" r="260" fill="url(#b)"/>
<g class="float" style="animation-delay:0s"><rect x="62" y="150" width="200" height="220" rx="14" fill="#fff" stroke="rgba(20,21,26,.10)" stroke-width="1.5" filter="url(#sh)"/><path d="M56 168h212l-12 46H68z" fill="#F2B632"/><path d="M109 168l-2 46" stroke="#fff" stroke-width="12"/><path d="M162 168l-1 46" stroke="#fff" stroke-width="12"/><path d="M215 168l0 46" stroke="#fff" stroke-width="12"/><text x="162" y="240" font-size="23" font-weight="700" fill="#14151A" text-anchor="middle">Taller</text><rect x="90" y="292" width="60" height="78" rx="8" fill="#14151A" stroke="none" stroke-width="1.5"/><rect x="170" y="292" width="68" height="48" rx="8" fill="#FDF0CF" stroke="none" stroke-width="1.5"/></g><g class="float" style="animation-delay:-2s"><rect x="300" y="112" width="200" height="258" rx="14" fill="#fff" stroke="rgba(20,21,26,.10)" stroke-width="1.5" filter="url(#sh)"/><path d="M294 130h212l-12 46H306z" fill="#F2B632"/><path d="M347 130l-2 46" stroke="#fff" stroke-width="12"/><path d="M400 130l-1 46" stroke="#fff" stroke-width="12"/><path d="M453 130l0 46" stroke="#fff" stroke-width="12"/><text x="400" y="202" font-size="23" font-weight="700" fill="#14151A" text-anchor="middle">Clínica</text><rect x="328" y="292" width="60" height="78" rx="8" fill="#14151A" stroke="none" stroke-width="1.5"/><rect x="408" y="292" width="68" height="48" rx="8" fill="#FDF0CF" stroke="none" stroke-width="1.5"/></g><g class="float" style="animation-delay:-4s"><rect x="538" y="150" width="200" height="220" rx="14" fill="#fff" stroke="rgba(20,21,26,.10)" stroke-width="1.5" filter="url(#sh)"/><path d="M532 168h212l-12 46H544z" fill="#F2B632"/><path d="M585 168l-2 46" stroke="#fff" stroke-width="12"/><path d="M638 168l-1 46" stroke="#fff" stroke-width="12"/><path d="M691 168l0 46" stroke="#fff" stroke-width="12"/><text x="638" y="240" font-size="23" font-weight="700" fill="#14151A" text-anchor="middle">Tienda</text><rect x="566" y="292" width="60" height="78" rx="8" fill="#14151A" stroke="none" stroke-width="1.5"/><rect x="646" y="292" width="68" height="48" rx="8" fill="#FDF0CF" stroke="none" stroke-width="1.5"/></g><path d="M30 372h740" stroke="#14151A" stroke-width="4" stroke-linecap="round"/>
</svg>
