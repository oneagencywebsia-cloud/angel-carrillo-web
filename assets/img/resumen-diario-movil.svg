<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" aria-label="El jefe recibe en el móvil un resumen diario del trabajo">
<title>El jefe recibe en el móvil un resumen diario del trabajo</title>
<style>
text{font-family:Inter,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
.serif{font-family:'Instrument Serif',Georgia,serif;font-weight:400}
.float{animation:float 6s ease-in-out infinite}
.pulse{animation:pulse 3.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.flow{stroke-dasharray:10 150;animation:flow 2.8s linear infinite}
.dot{animation:dot 1.2s ease-in-out infinite}
.scan{animation:scan 3.4s ease-in-out infinite alternate}
.spin{animation:spin 14s linear infinite;transform-box:fill-box;transform-origin:center}
@keyframes float{50%{transform:translateY(-8px)}}
@keyframes pulse{50%{transform:scale(1.07)}}
@keyframes flow{from{stroke-dashoffset:160}to{stroke-dashoffset:0}}
@keyframes dot{50%{opacity:.25}}
@keyframes scan{to{transform:translateY(222px)}}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.flow,.scan{display:none}}
</style>
<defs>
<radialGradient id="a"><stop offset="0" stop-color="#F2B632" stop-opacity=".34"/><stop offset="1" stop-color="#F2B632" stop-opacity="0"/></radialGradient>
<radialGradient id="b"><stop offset="0" stop-color="#FF9A5A" stop-opacity=".18"/><stop offset="1" stop-color="#FF9A5A" stop-opacity="0"/></radialGradient>
<pattern id="p" width="26" height="26" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.1" fill="#14151A" opacity=".07"/></pattern>
<filter id="sh" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#14151A" flood-opacity=".09"/></filter>
</defs>
<rect width="800" height="450" fill="#F8F6F1"/><rect width="800" height="450" fill="url(#p)"/>
<circle cx="700" cy="40" r="300" fill="url(#a)"/><circle cx="60" cy="440" r="260" fill="url(#b)"/>
<rect x="286" y="28" width="228" height="394" rx="36" fill="#14151A" stroke="none" stroke-width="1.5"/><rect x="298" y="40" width="204" height="370" rx="26" fill="#fff" stroke="none" stroke-width="1.5"/><rect x="362" y="50" width="76" height="18" rx="9" fill="#14151A" stroke="none" stroke-width="1.5"/><text x="400" y="128" font-size="46" font-weight="500" fill="#14151A" text-anchor="middle" class="serif">20:00</text><g class="float" style="animation-delay:0s"><rect x="250" y="160" width="300" height="190" rx="20" fill="#fff" stroke="rgba(20,21,26,.10)" stroke-width="1.5" filter="url(#sh)"/><g transform="translate(271.6 183.6) scale(1.2)" fill="none" stroke="#8F5D00" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9M10 21a2 2 0 0 0 4 0"/></g><text x="312" y="206" font-size="21" font-weight="700" fill="#14151A" text-anchor="start">Resumen del día</text><g transform="translate(284 238)"><circle r="11" fill="#146C34"/><path d="M-4.95 0.22l3.3 3.52l6.6 -6.82" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></g><text x="306" y="244" font-size="19" font-weight="500" fill="#14151A" text-anchor="start">Partes recibidos</text><g transform="translate(284 274)"><circle r="11" fill="#146C34"/><path d="M-4.95 0.22l3.3 3.52l6.6 -6.82" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></g><text x="306" y="280" font-size="19" font-weight="500" fill="#14151A" text-anchor="start">Horas anotadas</text><g transform="translate(284 310)"><circle r="11" fill="#146C34"/><path d="M-4.95 0.22l3.3 3.52l6.6 -6.82" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></g><text x="306" y="316" font-size="19" font-weight="500" fill="#14151A" text-anchor="start">Facturas leídas</text></g><g class="float" style="animation-delay:-2s"><rect x="50" y="120" width="190" height="72" rx="16" fill="#fff" stroke="rgba(20,21,26,.10)" stroke-width="1.5" filter="url(#sh)"/><rect x="64" y="134" width="44" height="44" rx="12" fill="#FDF0CF" stroke="none" stroke-width="1.5"/><g transform="translate(72.2 142.2) scale(1.15)" fill="none" stroke="#8F5D00" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></g><text x="122" y="164" font-size="20" font-weight="600" fill="#14151A" text-anchor="start">Electricista</text></g><g class="float" style="animation-delay:-4s"><rect x="560" y="270" width="180" height="72" rx="16" fill="#fff" stroke="rgba(20,21,26,.10)" stroke-width="1.5" filter="url(#sh)"/><rect x="574" y="284" width="44" height="44" rx="12" fill="#FDF0CF" stroke="none" stroke-width="1.5"/><g transform="translate(582.2 292.2) scale(1.15)" fill="none" stroke="#8F5D00" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6a7 7 0 1 0 0 12M4 10h9M4 14h8"/></g><text x="632" y="314" font-size="20" font-weight="600" fill="#14151A" text-anchor="start">Ganancia</text></g><path d="M242 156C270 156 262 190 286 190" fill="none" stroke="rgba(20,21,26,.14)" stroke-width="2.5" stroke-linecap="round"/><path class="flow" d="M242 156C270 156 262 190 286 190" fill="none" stroke="#F2B632" stroke-width="3.5" stroke-linecap="round"/><path d="M552 306H580" fill="none" stroke="rgba(20,21,26,.14)" stroke-width="2.5" stroke-linecap="round"/><path class="flow" d="M552 306H580" fill="none" stroke="#F2B632" stroke-width="3.5" stroke-linecap="round"/><text x="780" y="436" font-size="15" font-weight="500" fill="#54565F" text-anchor="end">Ejemplo ilustrativo</text>
</svg>
