<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" aria-label="Seguimientos, informes, avisos y hojas de cálculo que se actualizan solos en un ciclo automático">
<title>Seguimientos, informes, avisos y hojas de cálculo que se actualizan solos en un ciclo automático</title>
<style>
text{font-family:Inter,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
.serif{font-family:'Instrument Serif',Georgia,serif;font-weight:400}
.float{animation:float 6s ease-in-out infinite}
.pulse{animation:pulse 3.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.flow{stroke-dasharray:10 150;animation:flow 2.8s linear infinite}
.dot{animation:dot 1.2s ease-in-out infinite}
.scan{animation:scan 3.4s ease-in-out infinite alternate}
.spin{animation:spin 14s linear infinite;transform-box:fill-box;transform-origin:center}
@keyframes float{50%{transform:translateY(-8px)}}
@keyframes pulse{50%{transform:scale(1.07)}}
@keyframes flow{from{stroke-dashoffset:160}to{stroke-dashoffset:0}}
@keyframes dot{50%{opacity:.25}}
@keyframes scan{to{transform:translateY(222px)}}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.flow,.scan{display:none}}
</style>
<defs>
<radialGradient id="a"><stop offset="0" stop-color="#F2B632" stop-opacity=".34"/><stop offset="1" stop-color="#F2B632" stop-opacity="0"/></radialGradient>
<radialGradient id="b"><stop offset="0" stop-color="#FF9A5A" stop-opacity=".18"/><stop offset="1" stop-color="#FF9A5A" stop-opacity="0"/></radialGradient>
<pattern id="p" width="26" height="26" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.1" fill="#14151A" opacity=".07"/></pattern>
<filter id="sh" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#14151A" flood-opacity=".09"/></filter>
</defs>
<rect width="800" height="450" fill="#F8F6F1"/><rect width="800" height="450" fill="url(#p)"/>
<circle cx="700" cy="40" r="300" fill="url(#a)"/><circle cx="60" cy="440" r="260" fill="url(#b)"/>
<circle cx="400" cy="225" r="152" fill="none" stroke="rgba(20,21,26,.14)" stroke-width="2.5" stroke-dasharray="4 9" class="spin"/><path d="M400 73C484 73 552 141 552 225S484 377 400 377S248 309 248 225S316 73 400 73" fill="none" stroke="rgba(20,21,26,.14)" stroke-width="2.5" stroke-linecap="round"/><path class="flow" d="M400 73C484 73 552 141 552 225S484 377 400 377S248 309 248 225S316 73 400 73" fill="none" stroke="#F2B632" stroke-width="3.5" stroke-linecap="round"/><g class="pulse" style="animation-delay:0s"><circle cx="400" cy="225" r="72" fill="#F2B632"/></g><text x="400" y="220" font-size="25" font-weight="700" fill="#14151A" text-anchor="middle">Se hace</text><text x="400" y="250" font-size="25" font-weight="700" fill="#14151A" text-anchor="middle">solo</text><g class="float" style="animation-delay:0s"><rect x="300" y="38" width="200" height="72" rx="16" fill="#fff" stroke="rgba(20,21,26,.10)" stroke-width="1.5" filter="url(#sh)"/><rect x="314" y="52" width="44" height="44" rx="12" fill="#FDF0CF" stroke="none" stroke-width="1.5"/><g transform="translate(322.2 60.2) scale(1.15)" fill="none" stroke="#8F5D00" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></g><text x="372" y="82" font-size="20" font-weight="600" fill="#14151A" text-anchor="start">Seguimiento</text></g><g class="float" style="animation-delay:-1.5s"><rect x="510" y="189" width="200" height="72" rx="16" fill="#fff" stroke="rgba(20,21,26,.10)" stroke-width="1.5" filter="url(#sh)"/><rect x="524" y="203" width="44" height="44" rx="12" fill="#FDF0CF" stroke="none" stroke-width="1.5"/><g transform="translate(532.2 211.2) scale(1.15)" fill="none" stroke="#8F5D00" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M8 13h8M8 17h6"/></g><text x="582" y="233" font-size="20" font-weight="600" fill="#14151A" text-anchor="start">Informe</text></g><g class="float" style="animation-delay:-3s"><rect x="300" y="340" width="200" height="72" rx="16" fill="#fff" stroke="rgba(20,21,26,.10)" stroke-width="1.5" filter="url(#sh)"/><rect x="314" y="354" width="44" height="44" rx="12" fill="#FDF0CF" stroke="none" stroke-width="1.5"/><g transform="translate(322.2 362.2) scale(1.15)" fill="none" stroke="#8F5D00" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9M10 21a2 2 0 0 0 4 0"/></g><text x="372" y="384" font-size="20" font-weight="600" fill="#14151A" text-anchor="start">Aviso</text></g><g class="float" style="animation-delay:-4.5s"><rect x="90" y="189" width="200" height="72" rx="16" fill="#fff" stroke="rgba(20,21,26,.10)" stroke-width="1.5" filter="url(#sh)"/><rect x="104" y="203" width="44" height="44" rx="12" fill="#FDF0CF" stroke="none" stroke-width="1.5"/><g transform="translate(112.2 211.2) scale(1.15)" fill="none" stroke="#8F5D00" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 10h18M3 15h18M9 4v16"/></g><text x="162" y="233" font-size="20" font-weight="600" fill="#14151A" text-anchor="start">Hoja al día</text></g><text x="780" y="436" font-size="15" font-weight="500" fill="#54565F" text-anchor="end">Ejemplo ilustrativo</text>
</svg>
