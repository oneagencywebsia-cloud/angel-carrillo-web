<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" aria-label="Esfera de 24 horas con conversaciones atendidas a cualquier hora">
<title>Esfera de 24 horas con conversaciones atendidas a cualquier hora</title>
<style>
text{font-family:Inter,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
.serif{font-family:'Instrument Serif',Georgia,serif;font-weight:400}
.float{animation:float 6s ease-in-out infinite}
.pulse{animation:pulse 3.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.flow{stroke-dasharray:10 150;animation:flow 2.8s linear infinite}
.dot{animation:dot 1.2s ease-in-out infinite}
.scan{animation:scan 3.4s ease-in-out infinite alternate}
.spin{animation:spin 14s linear infinite;transform-box:fill-box;transform-origin:center}
@keyframes float{50%{transform:translateY(-8px)}}
@keyframes pulse{50%{transform:scale(1.07)}}
@keyframes flow{from{stroke-dashoffset:160}to{stroke-dashoffset:0}}
@keyframes dot{50%{opacity:.25}}
@keyframes scan{to{transform:translateY(222px)}}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.flow,.scan{display:none}}
</style>
<defs>
<radialGradient id="a"><stop offset="0" stop-color="#F2B632" stop-opacity=".34"/><stop offset="1" stop-color="#F2B632" stop-opacity="0"/></radialGradient>
<radialGradient id="b"><stop offset="0" stop-color="#FF9A5A" stop-opacity=".18"/><stop offset="1" stop-color="#FF9A5A" stop-opacity="0"/></radialGradient>
<pattern id="p" width="26" height="26" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.1" fill="#14151A" opacity=".07"/></pattern>
<filter id="sh" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#14151A" flood-opacity=".09"/></filter>
</defs>
<rect width="800" height="450" fill="#F8F6F1"/><rect width="800" height="450" fill="url(#p)"/>
<circle cx="700" cy="40" r="300" fill="url(#a)"/><circle cx="60" cy="440" r="260" fill="url(#b)"/>
<circle cx="400" cy="225" r="150" fill="#fff" filter="url(#sh)"/><circle class="spin" cx="400" cy="225" r="176" fill="none" stroke="#F2B632" stroke-width="5" stroke-linecap="round" stroke-dasharray="2 32"/><text x="400" y="250" font-size="84" font-weight="500" fill="#14151A" text-anchor="middle" class="serif">24 h</text><text x="400" y="292" font-size="17" font-weight="500" fill="#54565F" text-anchor="middle">sin dejar a nadie esperando</text><g class="float" style="animation-delay:0s"><rect x="80" y="70" width="150" height="50" rx="16" fill="#fff" stroke="rgba(20,21,26,.12)" stroke-width="1.5"/><text x="98" y="102" font-size="21" font-weight="500" fill="#14151A" text-anchor="start">Buenas</text></g><g class="float" style="animation-delay:-2s"><rect x="574" y="100" width="150" height="50" rx="16" fill="#F2B632" stroke="none" stroke-width="1.5"/><text x="592" y="132" font-size="21" font-weight="500" fill="#14151A" text-anchor="start">¡Hola!</text></g><g class="float" style="animation-delay:-3s"><rect x="92" y="308" width="150" height="50" rx="16" fill="#fff" stroke="rgba(20,21,26,.12)" stroke-width="1.5"/><text x="110" y="340" font-size="21" font-weight="500" fill="#14151A" text-anchor="start">¿Precio?</text></g><g class="float" style="animation-delay:-4.5s"><rect x="566" y="310" width="170" height="50" rx="16" fill="#F2B632" stroke="none" stroke-width="1.5"/><text x="584" y="342" font-size="21" font-weight="500" fill="#14151A" text-anchor="start">Te cuento</text></g>
</svg>
