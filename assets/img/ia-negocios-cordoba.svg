<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" aria-label="Mapa esquemático de Santaella, Córdoba y localidades cercanas donde trabajo">
<title>Mapa esquemático de Santaella, Córdoba y localidades cercanas donde trabajo</title>
<style>
text{font-family:Inter,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
.serif{font-family:'Instrument Serif',Georgia,serif;font-weight:400}
.float{animation:float 6s ease-in-out infinite}
.pulse{animation:pulse 3.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.flow{stroke-dasharray:10 150;animation:flow 2.8s linear infinite}
.dot{animation:dot 1.2s ease-in-out infinite}
.scan{animation:scan 3.4s ease-in-out infinite alternate}
.spin{animation:spin 14s linear infinite;transform-box:fill-box;transform-origin:center}
@keyframes float{50%{transform:translateY(-8px)}}
@keyframes pulse{50%{transform:scale(1.07)}}
@keyframes flow{from{stroke-dashoffset:160}to{stroke-dashoffset:0}}
@keyframes dot{50%{opacity:.25}}
@keyframes scan{to{transform:translateY(222px)}}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.flow,.scan{display:none}}
</style>
<defs>
<radialGradient id="a"><stop offset="0" stop-color="#F2B632" stop-opacity=".34"/><stop offset="1" stop-color="#F2B632" stop-opacity="0"/></radialGradient>
<radialGradient id="b"><stop offset="0" stop-color="#FF9A5A" stop-opacity=".18"/><stop offset="1" stop-color="#FF9A5A" stop-opacity="0"/></radialGradient>
<pattern id="p" width="26" height="26" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.1" fill="#14151A" opacity=".07"/></pattern>
<filter id="sh" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#14151A" flood-opacity=".09"/></filter>
</defs>
<rect width="800" height="450" fill="#F8F6F1"/><rect width="800" height="450" fill="url(#p)"/>
<circle cx="700" cy="40" r="300" fill="url(#a)"/><circle cx="60" cy="440" r="260" fill="url(#b)"/>
<path d="M490 290Q507 152 524 82" fill="none" stroke="rgba(20,21,26,.14)" stroke-width="2.5" stroke-linecap="round"/><path class="flow" d="M490 290Q507 152 524 82" fill="none" stroke="#F2B632" stroke-width="3.5" stroke-linecap="round"/><path d="M490 290Q471 220 452 218" fill="none" stroke="rgba(20,21,26,.14)" stroke-width="2.5" stroke-linecap="round"/><path class="flow" d="M490 290Q471 220 452 218" fill="none" stroke="#F2B632" stroke-width="3.5" stroke-linecap="round"/><path d="M490 290Q435 262.5 380 303" fill="none" stroke="rgba(20,21,26,.14)" stroke-width="2.5" stroke-linecap="round"/><path class="flow" d="M490 290Q435 262.5 380 303" fill="none" stroke="#F2B632" stroke-width="3.5" stroke-linecap="round"/><path d="M490 290Q387 211.5 284 201" fill="none" stroke="rgba(20,21,26,.14)" stroke-width="2.5" stroke-linecap="round"/><path class="flow" d="M490 290Q387 211.5 284 201" fill="none" stroke="#F2B632" stroke-width="3.5" stroke-linecap="round"/><path d="M490 290Q577.5 304.5 665 387" fill="none" stroke="rgba(20,21,26,.14)" stroke-width="2.5" stroke-linecap="round"/><path class="flow" d="M490 290Q577.5 304.5 665 387" fill="none" stroke="#F2B632" stroke-width="3.5" stroke-linecap="round"/><path d="M490 290Q509 311 528 400" fill="none" stroke="rgba(20,21,26,.14)" stroke-width="2.5" stroke-linecap="round"/><path class="flow" d="M490 290Q509 311 528 400" fill="none" stroke="#F2B632" stroke-width="3.5" stroke-linecap="round"/><circle cx="524" cy="82" r="9" fill="#fff" stroke="#14151A" stroke-width="3"/><text x="542" y="89" font-size="21" font-weight="600" fill="#14151A" text-anchor="start">Córdoba</text><circle cx="452" cy="218" r="9" fill="#fff" stroke="#14151A" stroke-width="3"/><text x="434" y="225" font-size="21" font-weight="600" fill="#14151A" text-anchor="end">La Carlota</text><circle cx="380" cy="303" r="9" fill="#fff" stroke="#14151A" stroke-width="3"/><text x="362" y="310" font-size="21" font-weight="600" fill="#14151A" text-anchor="end">Écija</text><circle cx="284" cy="201" r="9" fill="#fff" stroke="#14151A" stroke-width="3"/><text x="266" y="208" font-size="21" font-weight="600" fill="#14151A" text-anchor="end">Palma del Río</text><circle cx="665" cy="387" r="9" fill="#fff" stroke="#14151A" stroke-width="3"/><text x="683" y="394" font-size="21" font-weight="600" fill="#14151A" text-anchor="start">Lucena</text><circle cx="528" cy="400" r="9" fill="#fff" stroke="#14151A" stroke-width="3"/><text x="510" y="407" font-size="21" font-weight="600" fill="#14151A" text-anchor="end">Puente Genil</text><circle class="pulse" cx="490" cy="290" r="30" fill="#F2B632" opacity=".35"/><circle cx="490" cy="290" r="15" fill="#F2B632" stroke="#14151A" stroke-width="3"/><rect x="512" y="270" width="128" height="40" rx="20" fill="#14151A" stroke="none" stroke-width="1.5"/><text x="576" y="297" font-size="20" font-weight="700" fill="#fff" text-anchor="middle">Santaella</text><path d="M590 252v-58a31 31 0 1 1 46 0v58" fill="none" stroke="#FDF0CF" stroke-width="13"/><path d="M590 252v-58a31 31 0 1 1 46 0v58" fill="none" stroke="#C4624A" stroke-width="13" stroke-dasharray="13 13" opacity=".75"/><path d="M656 252v-58a31 31 0 1 1 46 0v58" fill="none" stroke="#FDF0CF" stroke-width="13"/><path d="M656 252v-58a31 31 0 1 1 46 0v58" fill="none" stroke="#C4624A" stroke-width="13" stroke-dasharray="13 13" opacity=".75"/><path d="M722 252v-58a31 31 0 1 1 46 0v58" fill="none" stroke="#FDF0CF" stroke-width="13"/><path d="M722 252v-58a31 31 0 1 1 46 0v58" fill="none" stroke="#C4624A" stroke-width="13" stroke-dasharray="13 13" opacity=".75"/><text x="780" y="436" font-size="15" font-weight="500" fill="#54565F" text-anchor="end">Mapa esquemático</text>
</svg>
