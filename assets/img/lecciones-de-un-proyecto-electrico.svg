<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" aria-label="Cinco lecciones aprendidas en un proyecto para una empresa de electricidad">
<title>Cinco lecciones aprendidas en un proyecto para una empresa de electricidad</title>
<style>
text{font-family:Inter,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
.serif{font-family:'Instrument Serif',Georgia,serif;font-weight:400}
.float{animation:float 6s ease-in-out infinite}
.pulse{animation:pulse 3.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.flow{stroke-dasharray:10 150;animation:flow 2.8s linear infinite}
.dot{animation:dot 1.2s ease-in-out infinite}
.scan{animation:scan 3.4s ease-in-out infinite alternate}
.spin{animation:spin 14s linear infinite;transform-box:fill-box;transform-origin:center}
@keyframes float{50%{transform:translateY(-8px)}}
@keyframes pulse{50%{transform:scale(1.07)}}
@keyframes flow{from{stroke-dashoffset:160}to{stroke-dashoffset:0}}
@keyframes dot{50%{opacity:.25}}
@keyframes scan{to{transform:translateY(222px)}}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.flow,.scan{display:none}}
</style>
<defs>
<radialGradient id="a"><stop offset="0" stop-color="#F2B632" stop-opacity=".34"/><stop offset="1" stop-color="#F2B632" stop-opacity="0"/></radialGradient>
<radialGradient id="b"><stop offset="0" stop-color="#FF9A5A" stop-opacity=".18"/><stop offset="1" stop-color="#FF9A5A" stop-opacity="0"/></radialGradient>
<pattern id="p" width="26" height="26" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.1" fill="#14151A" opacity=".07"/></pattern>
<filter id="sh" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#14151A" flood-opacity=".09"/></filter>
</defs>
<rect width="800" height="450" fill="#F8F6F1"/><rect width="800" height="450" fill="url(#p)"/>
<circle cx="700" cy="40" r="300" fill="url(#a)"/><circle cx="60" cy="440" r="260" fill="url(#b)"/>
<g class="pulse" style="animation-delay:0s"><circle cx="196" cy="225" r="116" fill="#F2B632"/><path d="M214 142l-66 100h40l-16 66 74-104h-44z" fill="#14151A"/></g><g class="float" style="animation-delay:0s"><rect x="370" y="44" width="340" height="60" rx="14" fill="#fff" stroke="rgba(20,21,26,.10)" stroke-width="1.5" filter="url(#sh)"/><circle cx="404" cy="74" r="18" fill="#14151A"/><text x="404" y="81" font-size="19" font-weight="700" fill="#fff" text-anchor="middle">1</text><rect x="440" y="62" width="190" height="10" rx="5" fill="#14151A" stroke="none" stroke-width="1.5"/><rect x="440" y="82" width="140" height="10" rx="5" fill="rgba(20,21,26,.12)" stroke="none" stroke-width="1.5"/></g><g class="float" style="animation-delay:-1s"><rect x="406" y="118" width="340" height="60" rx="14" fill="#fff" stroke="rgba(20,21,26,.10)" stroke-width="1.5" filter="url(#sh)"/><circle cx="440" cy="148" r="18" fill="#14151A"/><text x="440" y="155" font-size="19" font-weight="700" fill="#fff" text-anchor="middle">2</text><rect x="476" y="136" width="190" height="10" rx="5" fill="#14151A" stroke="none" stroke-width="1.5"/><rect x="476" y="156" width="140" height="10" rx="5" fill="rgba(20,21,26,.12)" stroke="none" stroke-width="1.5"/></g><g class="float" style="animation-delay:-2s"><rect x="370" y="192" width="340" height="60" rx="14" fill="#fff" stroke="rgba(20,21,26,.10)" stroke-width="1.5" filter="url(#sh)"/><circle cx="404" cy="222" r="18" fill="#14151A"/><text x="404" y="229" font-size="19" font-weight="700" fill="#fff" text-anchor="middle">3</text><rect x="440" y="210" width="190" height="10" rx="5" fill="#14151A" stroke="none" stroke-width="1.5"/><rect x="440" y="230" width="140" height="10" rx="5" fill="rgba(20,21,26,.12)" stroke="none" stroke-width="1.5"/></g><g class="float" style="animation-delay:-3s"><rect x="406" y="266" width="340" height="60" rx="14" fill="#fff" stroke="rgba(20,21,26,.10)" stroke-width="1.5" filter="url(#sh)"/><circle cx="440" cy="296" r="18" fill="#14151A"/><text x="440" y="303" font-size="19" font-weight="700" fill="#fff" text-anchor="middle">4</text><rect x="476" y="284" width="190" height="10" rx="5" fill="#14151A" stroke="none" stroke-width="1.5"/><rect x="476" y="304" width="140" height="10" rx="5" fill="rgba(20,21,26,.12)" stroke="none" stroke-width="1.5"/></g><g class="float" style="animation-delay:-4s"><rect x="370" y="340" width="340" height="60" rx="14" fill="#fff" stroke="rgba(20,21,26,.10)" stroke-width="1.5" filter="url(#sh)"/><circle cx="404" cy="370" r="18" fill="#14151A"/><text x="404" y="377" font-size="19" font-weight="700" fill="#fff" text-anchor="middle">5</text><rect x="440" y="358" width="190" height="10" rx="5" fill="#14151A" stroke="none" stroke-width="1.5"/><rect x="440" y="378" width="140" height="10" rx="5" fill="rgba(20,21,26,.12)" stroke="none" stroke-width="1.5"/></g>
</svg>
