<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" aria-label="Un cable de enchufe que acaba en una ventana de código: de electricista a programador">
<title>Un cable de enchufe que acaba en una ventana de código: de electricista a programador</title>
<style>
text{font-family:Inter,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
.serif{font-family:'Instrument Serif',Georgia,serif;font-weight:400}
.float{animation:float 6s ease-in-out infinite}
.pulse{animation:pulse 3.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.flow{stroke-dasharray:10 150;animation:flow 2.8s linear infinite}
.dot{animation:dot 1.2s ease-in-out infinite}
.scan{animation:scan 3.4s ease-in-out infinite alternate}
.spin{animation:spin 14s linear infinite;transform-box:fill-box;transform-origin:center}
@keyframes float{50%{transform:translateY(-8px)}}
@keyframes pulse{50%{transform:scale(1.07)}}
@keyframes flow{from{stroke-dashoffset:160}to{stroke-dashoffset:0}}
@keyframes dot{50%{opacity:.25}}
@keyframes scan{to{transform:translateY(222px)}}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.flow,.scan{display:none}}
</style>
<defs>
<radialGradient id="a"><stop offset="0" stop-color="#F2B632" stop-opacity=".34"/><stop offset="1" stop-color="#F2B632" stop-opacity="0"/></radialGradient>
<radialGradient id="b"><stop offset="0" stop-color="#FF9A5A" stop-opacity=".18"/><stop offset="1" stop-color="#FF9A5A" stop-opacity="0"/></radialGradient>
<pattern id="p" width="26" height="26" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.1" fill="#14151A" opacity=".07"/></pattern>
<filter id="sh" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#14151A" flood-opacity=".09"/></filter>
</defs>
<rect width="800" height="450" fill="#F8F6F1"/><rect width="800" height="450" fill="url(#p)"/>
<circle cx="700" cy="40" r="300" fill="url(#a)"/><circle cx="60" cy="440" r="260" fill="url(#b)"/>
<path d="M96 225C190 225 160 100 260 130S300 330 424 270" fill="none" stroke="#14151A" stroke-width="12" stroke-linecap="round"/><path class="flow" d="M96 225C190 225 160 100 260 130S300 330 424 270" fill="none" stroke="#F2B632" stroke-width="5" stroke-linecap="round"/><g class="float" style="animation-delay:0s"><rect x="52" y="190" width="66" height="70" rx="16" fill="#F2B632" stroke="#14151A" stroke-width="4"/><path d="M52 208H24M52 242H24" stroke="#14151A" stroke-width="10" stroke-linecap="round"/></g><g class="float" style="animation-delay:-3s"><rect x="420" y="82" width="330" height="286" rx="18" fill="#14151A" stroke="none" stroke-width="1.5"/><circle cx="450" cy="112" r="7" fill="#E5604D"/><circle cx="474" cy="112" r="7" fill="#F2B632"/><circle cx="498" cy="112" r="7" fill="#4CAF6D"/><rect x="450" y="150" width="150" height="12" rx="6" fill="#F2B632" stroke="none" stroke-width="1.5"/><rect x="478" y="182" width="220" height="12" rx="6" fill="#fff" stroke="none" stroke-width="1.5"/><rect x="450" y="214" width="110" height="12" rx="6" fill="#7FD39B" stroke="none" stroke-width="1.5"/><rect x="450" y="246" width="190" height="12" rx="6" fill="#fff" stroke="none" stroke-width="1.5"/><rect x="478" y="278" width="140" height="12" rx="6" fill="#F2B632" stroke="none" stroke-width="1.5"/><rect x="450" y="310" width="90" height="12" rx="6" fill="#fff" stroke="none" stroke-width="1.5"/><rect class="dot" x="554" y="307" width="12" height="22" fill="#F2B632"/></g><text x="96" y="408" font-size="26" font-weight="500" fill="#14151A" text-anchor="middle" class="serif">12 años</text><text x="585" y="408" font-size="26" font-weight="500" fill="#14151A" text-anchor="middle" class="serif">Hoy</text>
</svg>
