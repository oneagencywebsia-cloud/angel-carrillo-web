<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" aria-label="Tres formas de gestionar facturas: Excel, programa de contabilidad o lectura con IA">
<title>Tres formas de gestionar facturas: Excel, programa de contabilidad o lectura con IA</title>
<style>
text{font-family:Inter,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
.serif{font-family:'Instrument Serif',Georgia,serif;font-weight:400}
.float{animation:float 6s ease-in-out infinite}
.pulse{animation:pulse 3.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.flow{stroke-dasharray:10 150;animation:flow 2.8s linear infinite}
.dot{animation:dot 1.2s ease-in-out infinite}
.scan{animation:scan 3.4s ease-in-out infinite alternate}
.spin{animation:spin 14s linear infinite;transform-box:fill-box;transform-origin:center}
@keyframes float{50%{transform:translateY(-8px)}}
@keyframes pulse{50%{transform:scale(1.07)}}
@keyframes flow{from{stroke-dashoffset:160}to{stroke-dashoffset:0}}
@keyframes dot{50%{opacity:.25}}
@keyframes scan{to{transform:translateY(222px)}}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.flow,.scan{display:none}}
</style>
<defs>
<radialGradient id="a"><stop offset="0" stop-color="#F2B632" stop-opacity=".34"/><stop offset="1" stop-color="#F2B632" stop-opacity="0"/></radialGradient>
<radialGradient id="b"><stop offset="0" stop-color="#FF9A5A" stop-opacity=".18"/><stop offset="1" stop-color="#FF9A5A" stop-opacity="0"/></radialGradient>
<pattern id="p" width="26" height="26" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.1" fill="#14151A" opacity=".07"/></pattern>
<filter id="sh" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#14151A" flood-opacity=".09"/></filter>
</defs>
<rect width="800" height="450" fill="#F8F6F1"/><rect width="800" height="450" fill="url(#p)"/>
<circle cx="700" cy="40" r="300" fill="url(#a)"/><circle cx="60" cy="440" r="260" fill="url(#b)"/>
<g class="float" style="animation-delay:0s"><rect x="52" y="74" width="212" height="302" rx="18" fill="#fff" stroke="rgba(20,21,26,.10)" stroke-width="1.5" filter="url(#sh)"/><circle cx="158" cy="164" r="52" fill="#FDF0CF"/><g transform="translate(131.6 137.6) scale(2.2)" fill="none" stroke="#8F5D00" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 10h18M3 15h18M9 4v16"/></g><text x="158" y="260" font-size="23" font-weight="700" fill="#14151A" text-anchor="middle">Excel</text><text x="158" y="292" font-size="18" font-weight="500" fill="#54565F" text-anchor="middle">Pocas facturas</text><rect x="98" y="320" width="120" height="10" rx="5" fill="rgba(20,21,26,.12)" stroke="none" stroke-width="1.5"/><rect x="118" y="340" width="80" height="10" rx="5" fill="rgba(20,21,26,.12)" stroke="none" stroke-width="1.5"/></g><g class="float" style="animation-delay:-2s"><rect x="294" y="74" width="212" height="302" rx="18" fill="#fff" stroke="rgba(20,21,26,.10)" stroke-width="1.5" filter="url(#sh)"/><circle cx="400" cy="164" r="52" fill="#FDF0CF"/><g transform="translate(373.6 137.6) scale(2.2)" fill="none" stroke="#8F5D00" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6a7 7 0 1 0 0 12M4 10h9M4 14h8"/></g><text x="400" y="260" font-size="23" font-weight="700" fill="#14151A" text-anchor="middle">Contabilidad</text><text x="400" y="292" font-size="18" font-weight="500" fill="#54565F" text-anchor="middle">Registrar y ordenar</text><rect x="340" y="320" width="120" height="10" rx="5" fill="rgba(20,21,26,.12)" stroke="none" stroke-width="1.5"/><rect x="360" y="340" width="80" height="10" rx="5" fill="rgba(20,21,26,.12)" stroke="none" stroke-width="1.5"/></g><g class="float" style="animation-delay:-4s"><rect x="536" y="74" width="212" height="302" rx="18" fill="#fff" stroke="rgba(20,21,26,.10)" stroke-width="1.5" filter="url(#sh)"/><rect x="536" y="74" width="212" height="302" rx="18" fill="none" stroke="#F2B632" stroke-width="4"/><circle cx="642" cy="164" r="52" fill="#F2B632"/><g transform="translate(615.6 137.6) scale(2.2)" fill="none" stroke="#14151A" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></g><text x="642" y="260" font-size="23" font-weight="700" fill="#14151A" text-anchor="middle">Lectura con IA</text><text x="642" y="292" font-size="18" font-weight="500" fill="#54565F" text-anchor="middle">Muchas y variadas</text><rect x="582" y="320" width="120" height="10" rx="5" fill="rgba(20,21,26,.12)" stroke="none" stroke-width="1.5"/><rect x="602" y="340" width="80" height="10" rx="5" fill="rgba(20,21,26,.12)" stroke="none" stroke-width="1.5"/></g>
</svg>
