<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" aria-label="Un semáforo: lo que el asistente responde, lo que consulta y lo que no debe decir">
<title>Un semáforo: lo que el asistente responde, lo que consulta y lo que no debe decir</title>
<style>
text{font-family:Inter,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
.serif{font-family:'Instrument Serif',Georgia,serif;font-weight:400}
.float{animation:float 6s ease-in-out infinite}
.pulse{animation:pulse 3.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.flow{stroke-dasharray:10 150;animation:flow 2.8s linear infinite}
.dot{animation:dot 1.2s ease-in-out infinite}
.scan{animation:scan 3.4s ease-in-out infinite alternate}
.spin{animation:spin 14s linear infinite;transform-box:fill-box;transform-origin:center}
@keyframes float{50%{transform:translateY(-8px)}}
@keyframes pulse{50%{transform:scale(1.07)}}
@keyframes flow{from{stroke-dashoffset:160}to{stroke-dashoffset:0}}
@keyframes dot{50%{opacity:.25}}
@keyframes scan{to{transform:translateY(222px)}}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.flow,.scan{display:none}}
</style>
<defs>
<radialGradient id="a"><stop offset="0" stop-color="#F2B632" stop-opacity=".34"/><stop offset="1" stop-color="#F2B632" stop-opacity="0"/></radialGradient>
<radialGradient id="b"><stop offset="0" stop-color="#FF9A5A" stop-opacity=".18"/><stop offset="1" stop-color="#FF9A5A" stop-opacity="0"/></radialGradient>
<pattern id="p" width="26" height="26" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.1" fill="#14151A" opacity=".07"/></pattern>
<filter id="sh" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#14151A" flood-opacity=".09"/></filter>
</defs>
<rect width="800" height="450" fill="#F8F6F1"/><rect width="800" height="450" fill="url(#p)"/>
<circle cx="700" cy="40" r="300" fill="url(#a)"/><circle cx="60" cy="440" r="260" fill="url(#b)"/>
<rect x="150" y="44" width="128" height="362" rx="64" fill="#14151A" stroke="none" stroke-width="1.5"/><circle class="pulse" style="animation-delay:0s" cx="214" cy="114" r="42" fill="#E5604D"/><circle class="pulse" style="animation-delay:-1.2s" cx="214" cy="225" r="42" fill="#F2B632"/><circle class="pulse" style="animation-delay:-2.4s" cx="214" cy="336" r="42" fill="#4CAF6D"/><path d="M290 114H350" fill="none" stroke="rgba(20,21,26,.14)" stroke-width="2.5" stroke-linecap="round"/><path class="flow" d="M290 114H350" fill="none" stroke="#F2B632" stroke-width="3.5" stroke-linecap="round"/><g class="float" style="animation-delay:0s"><rect x="362" y="68" width="380" height="92" rx="18" fill="#fff" stroke="rgba(20,21,26,.10)" stroke-width="1.5" filter="url(#sh)"/><text x="390" y="108" font-size="25" font-weight="700" fill="#14151A" text-anchor="start">No inventa</text><text x="390" y="140" font-size="19" font-weight="500" fill="#54565F" text-anchor="start">Precios sin confirmar</text></g><path d="M290 225H350" fill="none" stroke="rgba(20,21,26,.14)" stroke-width="2.5" stroke-linecap="round"/><path class="flow" d="M290 225H350" fill="none" stroke="#F2B632" stroke-width="3.5" stroke-linecap="round"/><g class="float" style="animation-delay:-2s"><rect x="362" y="179" width="380" height="92" rx="18" fill="#fff" stroke="rgba(20,21,26,.10)" stroke-width="1.5" filter="url(#sh)"/><text x="390" y="219" font-size="25" font-weight="700" fill="#14151A" text-anchor="start">Consulta contigo</text><text x="390" y="251" font-size="19" font-weight="500" fill="#54565F" text-anchor="start">Casos fuera de lo normal</text></g><path d="M290 336H350" fill="none" stroke="rgba(20,21,26,.14)" stroke-width="2.5" stroke-linecap="round"/><path class="flow" d="M290 336H350" fill="none" stroke="#F2B632" stroke-width="3.5" stroke-linecap="round"/><g class="float" style="animation-delay:-4s"><rect x="362" y="290" width="380" height="92" rx="18" fill="#fff" stroke="rgba(20,21,26,.10)" stroke-width="1.5" filter="url(#sh)"/><text x="390" y="330" font-size="25" font-weight="700" fill="#14151A" text-anchor="start">Responde solo</text><text x="390" y="362" font-size="19" font-weight="500" fill="#54565F" text-anchor="start">Horarios y citas</text></g><text x="780" y="436" font-size="15" font-weight="500" fill="#54565F" text-anchor="end">Ejemplo ilustrativo</text>
</svg>
