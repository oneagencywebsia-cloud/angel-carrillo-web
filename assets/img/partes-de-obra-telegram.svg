<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" aria-label="Un mensaje del electricista a un bot se convierte en un parte de obra ordenado">
<title>Un mensaje del electricista a un bot se convierte en un parte de obra ordenado</title>
<style>
text{font-family:Inter,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
.serif{font-family:'Instrument Serif',Georgia,serif;font-weight:400}
.float{animation:float 6s ease-in-out infinite}
.pulse{animation:pulse 3.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.flow{stroke-dasharray:10 150;animation:flow 2.8s linear infinite}
.dot{animation:dot 1.2s ease-in-out infinite}
.scan{animation:scan 3.4s ease-in-out infinite alternate}
.spin{animation:spin 14s linear infinite;transform-box:fill-box;transform-origin:center}
@keyframes float{50%{transform:translateY(-8px)}}
@keyframes pulse{50%{transform:scale(1.07)}}
@keyframes flow{from{stroke-dashoffset:160}to{stroke-dashoffset:0}}
@keyframes dot{50%{opacity:.25}}
@keyframes scan{to{transform:translateY(222px)}}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.flow,.scan{display:none}}
</style>
<defs>
<radialGradient id="a"><stop offset="0" stop-color="#F2B632" stop-opacity=".34"/><stop offset="1" stop-color="#F2B632" stop-opacity="0"/></radialGradient>
<radialGradient id="b"><stop offset="0" stop-color="#FF9A5A" stop-opacity=".18"/><stop offset="1" stop-color="#FF9A5A" stop-opacity="0"/></radialGradient>
<pattern id="p" width="26" height="26" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.1" fill="#14151A" opacity=".07"/></pattern>
<filter id="sh" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#14151A" flood-opacity=".09"/></filter>
</defs>
<rect width="800" height="450" fill="#F8F6F1"/><rect width="800" height="450" fill="url(#p)"/>
<circle cx="700" cy="40" r="300" fill="url(#a)"/><circle cx="60" cy="440" r="260" fill="url(#b)"/>
<rect x="52" y="80" width="322" height="290" rx="26" fill="#fff" stroke="rgba(20,21,26,.10)" stroke-width="1.5" filter="url(#sh)"/><text x="80" y="124" font-size="20" font-weight="700" fill="#14151A" text-anchor="start">Mensaje al bot</text><path d="M52 146h322" stroke="rgba(20,21,26,.08)"/><rect x="90" y="170" width="260" height="106" rx="16" fill="#F2B632" stroke="none" stroke-width="1.5"/><text x="108" y="202" font-size="21" font-weight="500" fill="#14151A" text-anchor="start">Cambiado cuadro</text><text x="108" y="230" font-size="21" font-weight="500" fill="#14151A" text-anchor="start">en casa de Ana,</text><text x="108" y="258" font-size="21" font-weight="500" fill="#14151A" text-anchor="start">3 horas</text><g transform="translate(318 316)"><circle r="15" fill="#146C34"/><path d="M-6.75 0.3l4.5 4.8l9 -9.3" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g><rect x="76" y="296" width="82" height="38" rx="19" fill="#fff" stroke="rgba(20,21,26,.12)" stroke-width="1.5"/><circle class="dot" style="animation-delay:0s" cx="101" cy="315" r="5" fill="#54565F"/><circle class="dot" style="animation-delay:0.2s" cx="117" cy="315" r="5" fill="#54565F"/><circle class="dot" style="animation-delay:0.4s" cx="133" cy="315" r="5" fill="#54565F"/><path d="M386 225H420" fill="none" stroke="rgba(20,21,26,.14)" stroke-width="2.5" stroke-linecap="round"/><path class="flow" d="M386 225H420" fill="none" stroke="#F2B632" stroke-width="3.5" stroke-linecap="round"/><g class="float" style="animation-delay:-1s"><rect x="434" y="56" width="314" height="340" rx="18" fill="#fff" stroke="rgba(20,21,26,.10)" stroke-width="1.5" filter="url(#sh)"/><text x="458" y="100" font-size="23" font-weight="700" fill="#14151A" text-anchor="start">Parte de obra</text><rect x="646" y="76" width="82" height="32" rx="16" fill="#DCF2E3" stroke="none" stroke-width="1.5"/><text x="687" y="98" font-size="17" font-weight="700" fill="#146C34" text-anchor="middle">Listo</text><text x="458" y="152" font-size="19" font-weight="500" fill="#54565F" text-anchor="start">Cliente</text><text x="724" y="152" font-size="19" font-weight="600" fill="#14151A" text-anchor="end">Ana</text><path d="M458 170h266" stroke="rgba(20,21,26,.08)"/><text x="458" y="200" font-size="19" font-weight="500" fill="#54565F" text-anchor="start">Trabajo</text><text x="724" y="200" font-size="19" font-weight="600" fill="#14151A" text-anchor="end">Cuadro</text><path d="M458 218h266" stroke="rgba(20,21,26,.08)"/><text x="458" y="248" font-size="19" font-weight="500" fill="#54565F" text-anchor="start">Horas</text><text x="724" y="248" font-size="19" font-weight="600" fill="#14151A" text-anchor="end">3 h</text><path d="M458 266h266" stroke="rgba(20,21,26,.08)"/><text x="458" y="296" font-size="19" font-weight="500" fill="#54565F" text-anchor="start">Registrado</text><text x="724" y="296" font-size="19" font-weight="600" fill="#14151A" text-anchor="end">Hoy</text><path d="M458 314h266" stroke="rgba(20,21,26,.08)"/><rect x="458" y="332" width="266" height="44" rx="12" fill="#FDF0CF" stroke="none" stroke-width="1.5"/><g transform="translate(470.6 342.6) scale(0.95)" fill="none" stroke="#8F5D00" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9M10 21a2 2 0 0 0 4 0"/></g><text x="504" y="361" font-size="18" font-weight="600" fill="#14151A" text-anchor="start">Aviso enviado al jefe</text></g><text x="780" y="436" font-size="15" font-weight="500" fill="#54565F" text-anchor="end">Ejemplo ilustrativo</text>
</svg>
