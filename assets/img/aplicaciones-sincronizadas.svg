nd" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18M8 15h3"/></g></g><g class="float" style="animation-delay:-4s"><rect x="508" y="60" width="104" height="104" rx="24" fill="#fff" stroke="rgba(20,21,26,.10)" stroke-width="1.5" filter="url(#sh)"/><g transform="translate(534.8 86.8) scale(2.1)" fill="none" stroke="#8F5D00" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></g></g><g class="float" style="animation-delay:-1s"><rect x="190" y="290" width="104" height="104" rx="24" fill="#fff" stroke="rgba(20,21,26,.10)" stroke-width="1.5" filter="url(#sh)"/><g transform="translate(216.8 316.8) scale(2.1)" fill="none" stroke="#8F5D00" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></g></g><g class="float" style="animation-delay:-3s"><rect x="402" y="290" width="104" height="104" rx="24" fill="#fff" stroke="rgba(20,21,26,.10)" stroke-width="1.5" filter="url(#sh)"/><g transform="translate(428.8 316.8) scale(2.1)" fill="none" stroke="#8F5D00" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 10h18M3 15h18M9 4v16"/></g></g><circle class="pulse" style="animation-delay:0s" cx="136" cy="225" r="12" fill="#F2B632" stroke="#14151A" stroke-width="3"/><circle class="pulse" style="animation-delay:0.4s" cx="242" cy="225" r="12" fill="#F2B632" stroke="#14151A" stroke-width="3"/><circle class="pulse" style="animation-delay:0.8s" cx="348" cy="225" r="12" fill="#F2B632" stroke="#14151A" stroke-width="3"/><circle class="pulse" style="animation-delay:1.2000000000000002s" cx="454" cy="225" r="12" fill="#F2B632" stroke="#14151A" stroke-width="3"/><circle class="pulse" style="animation-delay:1.6s" cx="560" cy="225" r="12" fill="#F2B632" stroke="#14151A" stroke-width="3"/>
</svg>
