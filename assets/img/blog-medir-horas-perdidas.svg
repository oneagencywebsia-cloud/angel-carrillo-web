<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" aria-label="Un reloj y un gráfico semanal para apuntar el tiempo que se va en tareas repetitivas">
<title>Un reloj y un gráfico semanal para apuntar el tiempo que se va en tareas repetitivas</title>
<style>
text{font-family:Inter,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
.serif{font-family:'Instrument Serif',Georgia,serif;font-weight:400}
.float{animation:float 6s ease-in-out infinite}
.pulse{animation:pulse 3.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.flow{stroke-dasharray:10 150;animation:flow 2.8s linear infinite}
.dot{animation:dot 1.2s ease-in-out infinite}
.scan{animation:scan 3.4s ease-in-out infinite alternate}
.spin{animation:spin 14s linear infinite;transform-box:fill-box;transform-origin:center}
@keyframes float{50%{transform:translateY(-8px)}}
@keyframes pulse{50%{transform:scale(1.07)}}
@keyframes flow{from{stroke-dashoffset:160}to{stroke-dashoffset:0}}
@keyframes dot{50%{opacity:.25}}
@keyframes scan{to{transform:translateY(222px)}}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.flow,.scan{display:none}}
</style>
<defs>
<radialGradient id="a"><stop offset="0" stop-color="#F2B632" stop-opacity=".34"/><stop offset="1" stop-color="#F2B632" stop-opacity="0"/></radialGradient>
<radialGradient id="b"><stop offset="0" stop-color="#FF9A5A" stop-opacity=".18"/><stop offset="1" stop-color="#FF9A5A" stop-opacity="0"/></radialGradient>
<pattern id="p" width="26" height="26" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.1" fill="#14151A" opacity=".07"/></pattern>
<filter id="sh" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#14151A" flood-opacity=".09"/></filter>
</defs>
<rect width="800" height="450" fill="#F8F6F1"/><rect width="800" height="450" fill="url(#p)"/>
<circle cx="700" cy="40" r="300" fill="url(#a)"/><circle cx="60" cy="440" r="260" fill="url(#b)"/>
<rect x="60" y="70" width="300" height="310" rx="18" fill="#fff" stroke="rgba(20,21,26,.10)" stroke-width="1.5" filter="url(#sh)"/><g transform="translate(210 200)"><circle r="92" fill="#FDF0CF"/><circle r="92" fill="none" stroke="#14151A" stroke-width="5"/><path d="M0 -80v9" stroke="#14151A" stroke-width="3" transform="rotate(0)"/><path d="M0 -80v9" stroke="#14151A" stroke-width="3" transform="rotate(30)"/><path d="M0 -80v9" stroke="#14151A" stroke-width="3" transform="rotate(60)"/><path d="M0 -80v9" stroke="#14151A" stroke-width="3" transform="rotate(90)"/><path d="M0 -80v9" stroke="#14151A" stroke-width="3" transform="rotate(120)"/><path d="M0 -80v9" stroke="#14151A" stroke-width="3" transform="rotate(150)"/><path d="M0 -80v9" stroke="#14151A" stroke-width="3" transform="rotate(180)"/><path d="M0 -80v9" stroke="#14151A" stroke-width="3" transform="rotate(210)"/><path d="M0 -80v9" stroke="#14151A" stroke-width="3" transform="rotate(240)"/><path d="M0 -80v9" stroke="#14151A" stroke-width="3" transform="rotate(270)"/><path d="M0 -80v9" stroke="#14151A" stroke-width="3" transform="rotate(300)"/><path d="M0 -80v9" stroke="#14151A" stroke-width="3" transform="rotate(330)"/><path d="M0 0V-62" stroke="#14151A" stroke-width="6" stroke-linecap="round"><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="8s" repeatCount="indefinite"/></path><path d="M0 0L36 22" stroke="#8F5D00" stroke-width="7" stroke-linecap="round"/><circle r="8" fill="#F2B632" stroke="#14151A" stroke-width="3"/></g><text x="210" y="345" font-size="23" font-weight="700" fill="#14151A" text-anchor="middle">¿Cuánto se va?</text><rect x="400" y="70" width="340" height="310" rx="18" fill="#fff" stroke="rgba(20,21,26,.10)" stroke-width="1.5" filter="url(#sh)"/><text x="428" y="114" font-size="22" font-weight="700" fill="#14151A" text-anchor="start">Tu semana</text><rect x="436" y="238" width="36" height="92" rx="8" fill="rgba(242,182,50,.42)" stroke="none" stroke-width="1.5"/><text x="454" y="358" font-size="18" font-weight="500" fill="#54565F" text-anchor="middle">L</text><rect x="494" y="192" width="36" height="138" rx="8" fill="rgba(242,182,50,.42)" stroke="none" stroke-width="1.5"/><text x="512" y="358" font-size="18" font-weight="500" fill="#54565F" text-anchor="middle">M</text><rect x="552" y="222" width="36" height="108" rx="8" fill="rgba(242,182,50,.42)" stroke="none" stroke-width="1.5"/><text x="570" y="358" font-size="18" font-weight="500" fill="#54565F" text-anchor="middle">X</text><rect x="610" y="154" width="36" height="176" rx="8" fill="#F2B632" stroke="none" stroke-width="1.5"/><text x="628" y="358" font-size="18" font-weight="500" fill="#54565F" text-anchor="middle">J</text><rect x="668" y="198" width="36" height="132" rx="8" fill="rgba(242,182,50,.42)" stroke="none" stroke-width="1.5"/><text x="686" y="358" font-size="18" font-weight="500" fill="#54565F" text-anchor="middle">V</text><text x="780" y="436" font-size="15" font-weight="500" fill="#54565F" text-anchor="end">Ejemplo ilustrativo</text>
</svg>
