<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" aria-label="Matriz para decidir qué automatizar primero según el tiempo que quita y lo fácil que es">
<title>Matriz para decidir qué automatizar primero según el tiempo que quita y lo fácil que es</title>
<style>
text{font-family:Inter,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
.serif{font-family:'Instrument Serif',Georgia,serif;font-weight:400}
.float{animation:float 6s ease-in-out infinite}
.pulse{animation:pulse 3.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.flow{stroke-dasharray:10 150;animation:flow 2.8s linear infinite}
.dot{animation:dot 1.2s ease-in-out infinite}
.scan{animation:scan 3.4s ease-in-out infinite alternate}
.spin{animation:spin 14s linear infinite;transform-box:fill-box;transform-origin:center}
@keyframes float{50%{transform:translateY(-8px)}}
@keyframes pulse{50%{transform:scale(1.07)}}
@keyframes flow{from{stroke-dashoffset:160}to{stroke-dashoffset:0}}
@keyframes dot{50%{opacity:.25}}
@keyframes scan{to{transform:translateY(222px)}}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.flow,.scan{display:none}}
</style>
<defs>
<radialGradient id="a"><stop offset="0" stop-color="#F2B632" stop-opacity=".34"/><stop offset="1" stop-color="#F2B632" stop-opacity="0"/></radialGradient>
<radialGradient id="b"><stop offset="0" stop-color="#FF9A5A" stop-opacity=".18"/><stop offset="1" stop-color="#FF9A5A" stop-opacity="0"/></radialGradient>
<pattern id="p" width="26" height="26" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.1" fill="#14151A" opacity=".07"/></pattern>
<filter id="sh" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#14151A" flood-opacity=".09"/></filter>
</defs>
<rect width="800" height="450" fill="#F8F6F1"/><rect width="800" height="450" fill="url(#p)"/>
<circle cx="700" cy="40" r="300" fill="url(#a)"/><circle cx="60" cy="440" r="260" fill="url(#b)"/>
<rect x="144" y="46" width="250" height="152" rx="16" fill="#F2B632" stroke="rgba(20,21,26,.12)" stroke-width="1.5"/><text x="164" y="82" font-size="21" font-weight="700" fill="#14151A" text-anchor="start">Empieza aquí</text><rect x="408" y="46" width="250" height="152" rx="16" fill="#fff" stroke="rgba(20,21,26,.12)" stroke-width="1.5"/><text x="428" y="82" font-size="21" font-weight="700" fill="#14151A" text-anchor="start">Planifícalo</text><rect x="144" y="212" width="250" height="152" rx="16" fill="#fff" stroke="rgba(20,21,26,.12)" stroke-width="1.5"/><text x="164" y="248" font-size="21" font-weight="700" fill="#14151A" text-anchor="start">Si sobra tiempo</text><rect x="408" y="212" width="250" height="152" rx="16" fill="#fff" stroke="rgba(20,21,26,.12)" stroke-width="1.5"/><text x="428" y="248" font-size="21" font-weight="700" fill="#14151A" text-anchor="start">Déjalo</text><g class="float" style="animation-delay:0s"><rect x="176" y="108" width="122" height="40" rx="20" fill="#fff" stroke="#14151A" stroke-width="1.5"/><text x="193" y="135" font-size="19" font-weight="600" fill="#14151A" text-anchor="start">Mensajes</text></g><g class="float" style="animation-delay:-2s"><rect x="240" y="150" width="122" height="40" rx="20" fill="#fff" stroke="#14151A" stroke-width="1.5"/><text x="257" y="177" font-size="19" font-weight="600" fill="#14151A" text-anchor="start">Facturas</text></g><g class="float" style="animation-delay:-3s"><rect x="462" y="112" width="122" height="40" rx="20" fill="#fff" stroke="#14151A" stroke-width="1.5"/><text x="479" y="139" font-size="19" font-weight="600" fill="#14151A" text-anchor="start">Informes</text></g><g class="float" style="animation-delay:-1s"><rect x="190" y="282" width="100" height="40" rx="20" fill="#fff" stroke="#14151A" stroke-width="1.5"/><text x="207" y="309" font-size="19" font-weight="600" fill="#14151A" text-anchor="start">Avisos</text></g><path d="M120 366V50M120 50l-8 14M120 50l8 14M144 390H656M656 390l-14-8M656 390l-14 8" fill="none" stroke="#14151A" stroke-width="2.5" stroke-linecap="round"/><text transform="translate(96 210) rotate(-90)" font-size="19" fill="#54565F" text-anchor="middle">Tiempo que te quita</text><text x="400" y="422" font-size="19" font-weight="500" fill="#54565F" text-anchor="middle">← Más fácil      Más difícil →</text>
</svg>
