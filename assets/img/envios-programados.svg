w" d="M446 225C500 225 490 348 540 348" fill="none" stroke="#F2B632" stroke-width="3.5" stroke-linecap="round"/><g class="float" style="animation-delay:-4s"><rect x="540" y="316" width="96" height="68" rx="14" fill="#fff" stroke="rgba(20,21,26,.10)" stroke-width="1.5" filter="url(#sh)"/><g transform="translate(565.2 327.2) scale(1.9)" fill="none" stroke="#8F5D00" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></g></g><text x="780" y="436" font-size="15" font-weight="500" fill="#54565F" text-anchor="end">Ejemplo ilustrativo</text>
