server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    # Oculta versión de Nginx
    server_tokens off;

    # ── COMPRESIÓN GZIP ──
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain text/css text/xml text/javascript
        application/javascript application/json application/xml
        application/rss+xml image/svg+xml;

    # ── SEGURIDAD ──
    include /etc/nginx/security-headers.conf;

    # HTML siempre revalidado — evita servir versiones viejas tras un deploy
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/security-headers.conf;
    }

    # ── CACHÉ DE ASSETS (30 días — los nombres no llevan hash, 1 año sería arriesgado) ──
    location ~* \.(jpg|jpeg|png|gif|webp|ico|svg|woff2|woff|ttf)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000" always;
        include /etc/nginx/security-headers.conf;
    }

    # ── ROBOTS Y SITEMAP ──
    location = /robots.txt  { access_log off; }
    location = /sitemap.xml { access_log off; }

    # 404 real para rutas inexistentes (sin soft-404 que ensucie el crawl de Google)
    location / {
        try_files $uri $uri/ =404;
    }

    # Bloquea archivos ocultos (.git, .env, etc.)
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
