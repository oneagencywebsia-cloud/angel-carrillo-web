server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Oculta versión de Nginx
    server_tokens off;

    # ── COMPRESIÓN GZIP ──
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/html text/plain text/css text/xml text/javascript
        application/javascript application/json application/xml
        application/rss+xml image/svg+xml;

    # ── CACHÉ DE ASSETS ESTÁTICOS ──
    location ~* \.(jpg|jpeg|png|gif|webp|ico|svg|woff2|woff|ttf)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff";
    }

    location ~* \.(css|js)$ {
        expires 1M;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options "nosniff";
    }

    # ── SEGURIDAD ──
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self';" always;

    # ── ROBOTS Y SITEMAP ──
    location = /robots.txt  { access_log off; }
    location = /sitemap.xml { access_log off; }

    # ── SPA FALLBACK ──
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Bloquea archivos ocultos (.git, .env, etc.)
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
